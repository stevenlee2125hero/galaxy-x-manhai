name: Nightly authorized manga sync

on:
  schedule:
    # GitHub scheduled jobs can be delayed during load. These three UTC times
    # cover the Beijing 01:00 window without running the sync more than once.
    - cron: "0 17 * * *"
    - cron: "15 17 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-authorized-manga-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Avoid duplicate retry after a successful run
        id: guard
        run: node scripts/nightly-guard.mjs
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
      - name: Refresh official WEBTOON direct titles
        if: steps.guard.outputs.run == 'true'
        run: node scripts/refresh-webtoon-direct.mjs
      - name: Refresh 5000-title real catalog
        if: steps.guard.outputs.run == 'true'
        run: node scripts/build-network-catalog.mjs
      - name: Check authorized feeds
        if: steps.guard.outputs.run == 'true'
        run: node scripts/nightly-sync.mjs
      - name: Check for imported pages
        id: imports
        if: steps.guard.outputs.run == 'true'
        run: |
          if find imports -type f ! -name '.gitkeep' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true' && steps.imports.outputs.found == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Translate imported Japanese pages offline
        if: steps.guard.outputs.run == 'true' && steps.imports.outputs.found == 'true'
        run: |
          pip install -r requirements-translate.txt
          python scripts/translate-imports.py
      - name: Save sync status
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "mangaverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/comic-catalog.json public/sync-status.json public/source-status.json public/source-access.json public/covers public/translations 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: nightly authorized feed sync"
          git push
